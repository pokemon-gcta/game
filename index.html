<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon GBA Style</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101827; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; padding: 16px; }
    .game-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .title { color: white; font-weight: bold; }
    canvas { width: min(94vw, 960px); height: auto; border: 4px solid #1f2937; background: #5ec96f; image-rendering: pixelated; }
    .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 8px; user-select: none; }
    button { border: 2px solid #374151; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
    .btn { background: #4b5563; color: white; font-size: 24px; }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
    #down { grid-column: 2; grid-row: 3; }
    .actions { display: flex; gap: 12px; }
    .action-btn { width: 72px; height: 42px; background: #16a34a; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="title">Pokémon GBA Style Demo</div>
    <canvas id="game" width="480" height="320"></canvas>
    <div class="controls">
      <button class="btn" id="up">⬆</button>
      <button class="btn" id="left">⬅</button>
      <button class="btn" id="right">➡</button>
      <button class="btn" id="down">⬇</button>
    </div>
    <div class="actions">
      <button class="action-btn" id="aBtn">A</button>
      <button class="action-btn" id="bBtn">B</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // First overworld map.
    const mapImage = new Image();
    mapImage.src = 'src/images/IMG_5945.webp';
    let mapReady = false;
    mapImage.onload = () => { mapReady = true; draw(); };

    // Player sprite supplied in src/images/IMG_5946.png.
    const playerImage = new Image();
    playerImage.src = 'src/images/IMG_5946.png';
    let playerReady = false;
    playerImage.onload = () => { playerReady = true; draw(); };

    const tile = 32;
    const player = { x: 1, y: 1, color: '#2563eb' };
    const keys = { up: false, down: false, left: false, right: false };
    let message = 'Use the arrows or keyboard to explore.';
    let messageTimer = 0;

    function drawFallbackMap() {
      ctx.fillStyle = '#5ec96f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < canvas.height; y += tile) {
        for (let x = 0; x < canvas.width; x += tile) {
          ctx.fillStyle = (x / tile + y / tile) % 2 ? '#61c96d' : '#58bd67';
          ctx.fillRect(x, y, tile, tile);
        }
      }
    }

    function drawMap() {
      if (!mapReady) {
        drawFallbackMap();
        return;
      }
      const scale = Math.max(canvas.width / mapImage.width, canvas.height / mapImage.height);
      const width = mapImage.width * scale;
      const height = mapImage.height * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;
      ctx.drawImage(mapImage, x, y, width, height);
    }

    function drawFallbackPlayer(x, y) {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(x + 2, y + 24, 26, 6);
      ctx.fillStyle = player.color;
      ctx.fillRect(x + 4, y + 4, 24, 24);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x + 10, y + 9, 4, 4);
      ctx.fillRect(x + 18, y + 9, 4, 4);
    }

    function drawPlayer() {
      const x = player.x * tile;
      const y = player.y * tile;

      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(x + 4, y + 26, 24, 5);

      if (playerReady) {
        // IMG_5946.png is a 32x32 player sprite, so it fits one map tile.
        ctx.drawImage(playerImage, x, y, tile, tile);
      } else {
        drawFallbackPlayer(x, y);
      }
    }

    function drawMessage() {
      ctx.fillStyle = 'rgba(15,23,42,.86)';
      ctx.fillRect(12, 270, 456, 38);
      ctx.strokeStyle = '#f8fafc';
      ctx.strokeRect(12, 270, 456, 38);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(message, canvas.width / 2, 294);
    }

    function draw() {
      drawMap();
      drawPlayer();
      drawMessage();
    }

    function move(dx, dy) {
      const nextX = Math.max(0, Math.min(13, player.x + dx));
      const nextY = Math.max(0, Math.min(8, player.y + dy));
      if (nextX !== player.x || nextY !== player.y) {
        player.x = nextX;
        player.y = nextY;
        message = `Map position: ${player.x}, ${player.y}`;
        messageTimer = 90;
      }
    }

    function update() {
      if (keys.up) move(0, -1);
      if (keys.down) move(0, 1);
      if (keys.left) move(-1, 0);
      if (keys.right) move(1, 0);
      if (messageTimer > 0) messageTimer--;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function bindDirection(id, direction) {
      const button = document.getElementById(id);
      button.addEventListener('pointerdown', () => { keys[direction] = true; });
      button.addEventListener('pointerup', () => { keys[direction] = false; });
      button.addEventListener('pointerleave', () => { keys[direction] = false; });
    }

    bindDirection('up', 'up');
    bindDirection('down', 'down');
    bindDirection('left', 'left');
    bindDirection('right', 'right');

    document.getElementById('aBtn').addEventListener('click', () => {
      message = 'A button pressed.';
      messageTimer = 90;
    });
    document.getElementById('bBtn').addEventListener('click', () => {
      message = 'B button pressed.';
      messageTimer = 90;
    });

    window.addEventListener('keydown', (event) => {
      const directionByKey = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
      };
      if (directionByKey[event.key]) {
        event.preventDefault();
        keys[directionByKey[event.key]] = true;
      }
      if (event.key.toLowerCase() === 'a') document.getElementById('aBtn').click();
      if (event.key.toLowerCase() === 'b') document.getElementById('bBtn').click();
    });

    window.addEventListener('keyup', (event) => {
      const directionByKey = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
      };
      if (directionByKey[event.key]) keys[directionByKey[event.key]] = false;
    });

    draw();
    loop();
  </script>
</body>
</html>
